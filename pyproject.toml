[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "godkai-back"
version = "0.1.0"
description = "Backend del agente godKAI basado en LiveKit Agents"
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alejandro Huerta" }]
dependencies = [
  "livekit>=1.0",
  "livekit-agents~=1.3",
  "livekit-plugins-deepgram~=1.3",
  "livekit-plugins-openai~=1.3",
  "livekit-plugins-google~=1.3",
  "livekit-plugins-silero~=1.3",
  "livekit-plugins-turn-detector~=1.3",
  "livekit-plugins-noise-cancellation>=0.2,<0.3",
  "python-dotenv>=1.0",
  "openai>=1.50",
  "google-generativeai>=0.6"
]

[tool.godkai]
entrypoint = "agent.py"
config_file = "config.json"
default_prompt = "prompts/generic.txt"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
# El proyecto es una aplicación (agent.py), no un paquete distribuible.
# Sin esto, `uv sync` / `uv run` intentan construirlo con setuptools y
# fallan: el auto-discovery flat-layout encuentra varios directorios top-level.
package = false
