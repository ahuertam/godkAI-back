[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "godkai-back"
version = "0.1.0"
description = "Backend del agente godKAI basado en LiveKit Agents"
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = { text = "Proprietary" }
authors = [{ name = "Alejandro Huerta" }]
dependencies = [
  "livekit>=1.0",
  "livekit-agents~=1.3",
  "livekit-plugins-deepgram~=1.3",
  "livekit-plugins-openai~=1.3",
  "livekit-plugins-google~=1.3",
  "livekit-plugins-silero~=1.3",
  "livekit-plugins-turn-detector~=1.3",
  "livekit-plugins-noise-cancellation>=0.2,<0.3",
  "python-dotenv>=1.0",
  "openai>=1.50",
  "google-generativeai>=0.6"
]

[tool.godkai]
entrypoint = "agent.py"
config_file = "config.json"
default_prompt = "prompts/generic.txt"
